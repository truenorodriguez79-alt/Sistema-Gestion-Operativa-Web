<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Gráfica de Pastel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet"
      href="assets/css/grafica_pastel.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

</head>

<body>

<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

    <a
        href="index.html"
        class="btn btn-outline-primary">

        <i class="fa-solid fa-arrow-left"></i>

        Regresar al Inicio

    </a>

</div>

    <h2 class="text-center mb-4">

        <i class="fa-solid fa-chart-pie"></i>

        Gráfica de Cumplimiento

    </h2>

    <div class="card p-4 mb-4">

        <div class="row">

            <div class="col-md-8">

                <input
                    id="archivoExcel"
                    type="file"
                    class="form-control"
                    accept=".xlsx,.xls">

            </div>

            <div class="col-md-4">

                <button
                    id="btnGenerarGrafica"
                    class="btn btn-primary w-100">

                    Generar Gráfica

                </button>

            </div>

        </div>

    </div>

   <div class="card p-4 mb-4">

    <div class="d-flex justify-content-center">

        <div style="width:600px; height:600px;">

            <canvas id="graficaPastel"></canvas>

             <hr class="my-5">

<h3 class="text-center mb-4">
    Comparación entre Meses
</h3>

<div class="row mb-4">

    <div class="col-md-5">

        <label class="form-label">
            Mes 1
        </label>

        <select
            id="mesComparacion1"
            class="form-select">
        </select>

    </div>

    <div class="col-md-5">

        <label class="form-label">
            Mes 2
        </label>

        <select
            id="mesComparacion2"
            class="form-select">
        </select>

    </div>

    <div class="col-md-2 d-grid">

        <label>&nbsp;</label>

        <button
            id="btnCompararMeses"
            class="btn btn-primary">

            Comparar

        </button>

    </div>

</div>

<div class="row">

    <div class="col-lg-6">

        <canvas
            id="graficaMes1">
        </canvas>

    </div>

    <div class="col-lg-6">

        <canvas
            id="graficaMes2">
        </canvas>

    </div>

</div>

<div
    id="resultadoComparacion"
    class="mt-4">
</div>

        </div>

    </div>

</div>

    <div class="row">

        <div class="col-lg-4">

            <div class="card h-100">

                <div class="card-header bg-success text-white">

                    🟢 Zonas Verdes

                </div>

                <div
                    id="listaVerdes"
                    class="card-body">

                </div>

            </div>

        </div>

        <div class="col-lg-4">

            <div class="card h-100">

                <div class="card-header bg-warning">

                    🟡 Zonas Amarillas

                </div>

                <div
                    id="listaAmarillas"
                    class="card-body">

                </div>

            </div>

        </div>

        <div class="col-lg-4">

            <div class="card h-100">

                <div class="card-header bg-danger text-white">

                    🔴 Zonas Rojas

                </div>

                <div
                    id="listaRojas"
                    class="card-body">

                </div>

            </div>

        </div>

    </div>

</div>

<script src="assets/js/grafica_pastel.js"></script>

</body>

</html>
